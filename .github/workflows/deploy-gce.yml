name: Deploy to GCE VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-gce
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCE_SSH_HOST }}
          username: ${{ secrets.GCE_SSH_USER }}
          key: ${{ secrets.GCE_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            REPO_ROOT="${REPO_ROOT:-$HOME/live-trading-bot}"
            cd "$REPO_ROOT"
            chmod +x scripts/deploy_on_vm.sh
            DEPLOY_BRANCH=main ./scripts/deploy_on_vm.sh
